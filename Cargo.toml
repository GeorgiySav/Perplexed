[package]
name = "perplexed"
version = "0.1.0"
edition = "2024"

[dependencies]
# async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI parsing
clap = { version = "4", features = ["derive"] }

# errors
thiserror = "1"
anyhow = "1"

# URL handling
url = "2"

# futures combinators
futures = "0.3"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# html extractor
dom_smoothie = "0.17.0"

# CLI styling
crossterm = "0.29.0"
indicatif = "0.18.4"
rustyline = "18.0.0"
